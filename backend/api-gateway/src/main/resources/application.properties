spring.application.name=api-gateway

server.port=8080

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT
jwt.secret=UmVzb2x2ZU5vd1NlcnZpY2VKV1RTZWNyZXRLZXlGb3JQcm9qZWN0MjAyNg==

# Gateway Routes

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=complaint-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://COMPLAINT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/complaints/**

spring.cloud.gateway.server.webmvc.routes[2].id=assignment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ASSIGNMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/assignments/**

spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/notifications/**