spring.application.name=complaint-service

server.port=8082

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/resolvenow_db?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:9010}

# JWT
jwt.secret=${JWT_SECRET:UmVzb2x2ZU5vd1NlcnZpY2VKV1RTZWNyZXRLZXlGb3JQcm9qZWN0MjAyNg==}
jwt.expiration=${JWT_EXPIRATION:86400000}
internal.service-token=${INTERNAL_SERVICE_TOKEN:resolvenow-internal-token-2026}

# SLA Thresholds in hours
sla.threshold.hours.low=72
sla.threshold.hours.medium=48
sla.threshold.hours.high=24
sla.threshold.hours.critical=4

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
